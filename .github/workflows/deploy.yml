name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # GitHub's cloud runners can't reach the server's SSH port from the internet.
      # Join the tailnet for this run only (ephemeral node tagged tag:ci), then SSH over Tailscale.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to pf9-apps
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PF9_APPS_HOST }}
          username: ${{ secrets.PF9_APPS_USER }}
          key: ${{ secrets.PF9_APPS_SSH_KEY }}
          script: |
            cd /opt/pf9-apps/inspectr
            git pull origin main
            cd /opt/pf9-apps
            docker compose build inspectr
            docker compose up -d inspectr
